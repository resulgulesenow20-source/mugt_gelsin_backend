<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mugt Gelsin - Yeni Logo</title>
    <style>
        /* Sağdaki resimdeki yeşil arka planı taklit ediyoruz */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(180deg, #A8E08C 0%, #76C97E 100%); /* Sağdaki resme benzer yeşil geçiş */
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Soldaki resimdeki M ikonunun SVG boyutu */
        .logo-mark {
            position: relative;
            width: 140px;
            height: 100px;
            margin-bottom: 15px;
        }

        .m-path, .speed-line {
            fill: url(#orangeGradient);
        }

        /* Sağdaki resimdeki "Mugut gelsin" yazı stili */
        .logo-text {
            color: #FFFFFF;
            font-size: 48px;
            font-weight: 800; /* Çok kalın font */
            line-height: 1.1; /* Satır aralığı dar */
            letter-spacing: -1.5px; /* Harfler birbirine yakın */
            margin: 0;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.1);
        }

        .logo-text span {
            display: block; /* Alt alta yazmak için */
        }
    </style>
</head>
<body>

    <div class="logo-container">
        
        <!-- Soldaki Hız Çizgili M İkonu -->
        <div class="logo-mark">
            <svg viewBox="0 0 200 150" width="100%" height="100%">
                <defs>
                    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFC107" /> <!-- Sarı -->
                        <stop offset="100%" stop-color="#FF6B00" /> <!-- Turuncu -->
                    </linearGradient>
                </defs>
                
                <!-- Hız Çizgileri -->
                <rect class="speed-line" x="10" y="30" width="40" height="14" rx="7" />
                <rect class="speed-line" x="25" y="55" width="50" height="14" rx="7" />
                <rect class="speed-line" x="0" y="80" width="35" height="14" rx="7" />
                <rect class="speed-line" x="30" y="105" width="45" height="14" rx="7" />

                <!-- M Harfi -->
                <path class="m-path" d="M 60,130 
                         L 60,40 
                         C 60,25 75,20 85,30 
                         L 115,70 
                         L 145,30 
                         C 155,20 170,25 170,40 
                         L 170,130 
                         C 170,138 162,145 154,145 
                         L 154,145 
                         C 146,145 138,138 138,130 
                         L 138,75 
                         L 122,96 
                         C 118,101 112,101 108,96 
                         L 92,75 
                         L 92,130 
                         C 92,138 84,145 76,145 
                         L 76,145 
                         C 68,145 60,138 60,130 Z" />
            </svg>
        </div>

        <!-- Sağdaki Resimden Alınan Yazı Stili -->
        <h1 class="logo-text">
            <span>Mugut</span>
            <span>gelsin</span>
        </h1>

    </div>

</body>
</html>
